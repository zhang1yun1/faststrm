name: Sync Upstream & Release Kodi Addon

on:
  schedule:
    - cron: '28 * * * *' # 每 1 小时检查一次上游更新
  push:
    branches:
      - go
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # 支持在 GitHub Web 界面手动一键触发

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: go
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream & Check Updates
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wabisabi926/faststrm.git || true
          git fetch upstream go

          NEW_COMMITS_COUNT=$(git rev-list --count HEAD..upstream/go)
          echo "New commits count from upstream: ${NEW_COMMITS_COUNT}"

          # 若上游有新 commit 则先合并到当前分支
          if [ "${NEW_COMMITS_COUNT}" -gt 0 ]; then
            echo "Merging ${NEW_COMMITS_COUNT} upstream commits into go branch..."
            if ! git merge upstream/go --no-edit -X theirs --allow-unrelated-histories; then
              echo "Merge encountered conflicts, aborting merge..."
              git merge --abort || true
            fi
            git push origin go || echo "No changes to push or push skipped."
          fi

          # 提取当前分支代码中的版本号
          CURRENT_VER="v1.3.2"
          if [ -f "cmd/server/main.go" ]; then
            EXTRACTED_VER=$(grep -E '^[[:space:]]*version[[:space:]]*=' cmd/server/main.go | cut -d '"' -f 2)
            if [ -n "${EXTRACTED_VER}" ]; then
              CURRENT_VER="${EXTRACTED_VER}"
            fi
          fi
          echo "Current codebase version: ${CURRENT_VER}"

          # 检查 GitHub Releases 中该版本是否存在且包含 arm64 资产
          RELEASE_EXISTS=false
          if gh release view "${CURRENT_VER}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_EXISTS=true
            echo "Release ${CURRENT_VER} already exists on GitHub."
          else
            echo "Release ${CURRENT_VER} does NOT exist yet on GitHub."
          fi

          # 判定是否需要构建发布：
          # 1. 手动触发 (workflow_dispatch)
          # 2. push 触发 (例如 Sync fork 或代码推送)
          # 3. 上游有新 commit (NEW_COMMITS_COUNT > 0)
          # 4. 当前代码版本尚未在 GitHub Releases 发布 (RELEASE_EXISTS == false)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ] || [ "${NEW_COMMITS_COUNT}" -gt 0 ] || [ "${RELEASE_EXISTS}" = "false" ]; then
            echo "Build condition met! Proceeding to build and release."
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "No new upstream commits and Release ${CURRENT_VER} already exists. Skipping build."
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go Environment
        if: steps.sync.outputs.has_update == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Build Tools
        if: steps.sync.outputs.has_update == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y zip curl rsync

      - name: Run Kodi Addon Build Script (ARM64)
        if: steps.sync.outputs.has_update == 'true'
        run: |
          chmod +x ./build_kodi_addon.sh
          echo "Building ARM64 package for CoreELEC..."
          ./build_kodi_addon.sh arm64

      - name: Determine Version and Locate Assets
        if: steps.sync.outputs.has_update == 'true'
        id: get_info
        run: |
          VERSION="v1.3.2"
          ZIP_SRC=$(ls dist/service.faststrm-*-arm64.zip | head -n 1)
          if [ -f "${ZIP_SRC}" ]; then
            KODI_VER=$(unzip -p "${ZIP_SRC}" "service.faststrm/addon.xml" | grep '<addon ' | sed -n 's/.*version="\([^"]*\)".*/\1/p')
            if [ -n "${KODI_VER}" ]; then
              VERSION="v${KODI_VER}"
            fi
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Determined Version: ${VERSION}"
          echo "Generated ARM64 ZIP package:"
          ls -lh dist/service.faststrm-*-arm64.zip

      - name: Create or Update GitHub Release
        if: steps.sync.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_info.outputs.VERSION }}"
          ZIP_SRC=$(ls dist/service.faststrm-*-arm64.zip | head -n 1)
          
          echo "Releasing version ${VERSION} with ARM64 zip asset to repository ${{ github.repository }}..."
          
          if gh release view "${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists in ${{ github.repository }}, uploading asset..."
            gh release upload "${VERSION}" "${ZIP_SRC}" --clobber --repo "${{ github.repository }}"
          else
            echo "Release ${VERSION} does not exist in ${{ github.repository }}, creating release..."
            gh release create "${VERSION}" "${ZIP_SRC}" \
              --repo "${{ github.repository }}" \
              --title "FastStrm Kodi Addon ${VERSION} (CoreELEC ARM64)" \
              --notes "FastStrm Kodi 后台服务插件自动构建发布版本。适合在 CoreELEC / Linux-arm64 上直接安装使用。"
          fi

      - name: Deploy Addon to Kodi Repository Server
        if: steps.sync.outputs.has_update == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PATH: ${{ secrets.SERVER_PATH || '/var/www/kodi' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          VERSION: ${{ steps.get_info.outputs.VERSION }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${SERVER_HOST}" ]; then
            echo "::warning::未配置 SERVER_SSH_KEY 或 SERVER_HOST Secret，跳过自动同步部署到 Kodi 插件库服务器。"
            exit 0
          fi

          echo "=========================================="
          echo "开始同步 FastStrm 插件至 Kodi 插件库服务器"
          echo "目标部署根目录: ${SERVER_PATH}"
          echo "=========================================="

          # 1. 提取符合 Kodi 规范的纯点分版本号 (例如 1.3.2)
          KODI_VER=$(echo "${VERSION}" | sed 's/^v//' | sed 's/-.*//')
          
          # 2. 组装插件库规范的 staging 目录
          STAGING_DIR="dist/repo_staging/zips/service.faststrm"
          mkdir -p "${STAGING_DIR}"
          
          ZIP_SRC=$(ls dist/service.faststrm-*-arm64.zip | head -n 1)
          if [ ! -f "${ZIP_SRC}" ]; then
            echo "错误: 未找到构建好的 ZIP 产物！"
            exit 1
          fi
          
          # 复制标准命名的 zip 包
          cp "${ZIP_SRC}" "${STAGING_DIR}/service.faststrm-${KODI_VER}.zip"
          
          # 从 ZIP 中提取 addon.xml 与 icon.png
          unzip -p "${ZIP_SRC}" "service.faststrm/addon.xml" > "${STAGING_DIR}/addon.xml"
          unzip -p "${ZIP_SRC}" "service.faststrm/icon.png" > "${STAGING_DIR}/icon.png"
          
          # 3. 配置 SSH 密钥与环境
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. 同步插件文件到远程插件库目录 (使用 rsync 并设置所有文件和目录具有公共读取权限)
          echo "正在同步插件包至 ${SERVER_HOST}:${SERVER_PATH}/zips/service.faststrm/ ..."
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${SERVER_PATH}/zips/service.faststrm"
          rsync -avz --perms --chmod=a+rX -e "ssh -p ${SERVER_PORT} -o StrictHostKeyChecking=no" dist/repo_staging/zips/service.faststrm/ "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/zips/service.faststrm/"
          
          # 5. 上传并执行 build_repo.py 更新全局 addons.xml 和 md5 索引
          echo "正在更新远程插件库索引 addons.xml 与 md5..."
          rsync -avz --perms --chmod=a+rX -e "ssh -p ${SERVER_PORT} -o StrictHostKeyChecking=no" scripts/build_repo.py "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/build_repo.py"
          ssh -p "${SERVER_PORT}" -o StrictHostKeyChecking=no "${SERVER_USER}@${SERVER_HOST}" "python3 ${SERVER_PATH}/build_repo.py ${SERVER_PATH} && chmod -R a+rX ${SERVER_PATH}"

          echo "=========================================="
          echo "FastStrm 插件已成功发布至 Kodi 插件库！"
          echo "=========================================="
